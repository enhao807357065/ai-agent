<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Streaming Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.2rem;
            color: #e94560;
            white-space: nowrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }

        .status-dot.streaming { background: #4caf50; animation: pulse 1s infinite; }
        .status-dot.disconnected { background: #f44336; }
        .status-dot.reconnecting { background: #ff9800; animation: pulse 0.5s infinite; }
        .status-dot.done { background: #2196f3; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-disconnect {
            background: #f44336;
            color: white;
        }

        .btn-reconnect {
            background: #4caf50;
            color: white;
        }

        .btn-stop {
            background: #ff9800;
            color: white;
        }

        .btn-clear {
            background: #607d8b;
            color: white;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #0f3460;
            border-bottom-right-radius: 4px;
            color: #e0e0e0;
        }

        .message.assistant .message-bubble {
            background: #222244;
            border-bottom-left-radius: 4px;
            color: #e0e0e0;
        }

        .message-bubble p { margin: 0.5em 0; }
        .message-bubble p:first-child { margin-top: 0; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble code {
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .message-bubble pre {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message-bubble pre code {
            background: none;
            padding: 0;
        }

        .cursor-blink::after {
            content: '▊';
            animation: blink 1s infinite;
            color: #e94560;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Input area */
        .input-container {
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #0f3460;
            border-radius: 12px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: #e94560;
        }

        textarea::placeholder {
            color: #666;
        }

        .btn-send {
            background: #e94560;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            min-width: 60px;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .header {
                padding: 10px 12px;
            }
            .header h1 {
                font-size: 1rem;
            }
            .btn {
                padding: 5px 10px;
                font-size: 0.8rem;
            }
            .chat-container {
                padding: 12px;
            }
            .message-bubble {
                max-width: 85%;
            }
            .input-container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>LLM Streaming Demo</h1>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">就绪</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-disconnect" id="btnDisconnect" disabled onclick="disconnect()">断开</button>
            <button class="btn btn-reconnect" id="btnReconnect" disabled onclick="reconnect()">重连</button>
            <button class="btn btn-stop" id="btnStop" disabled onclick="stopGeneration()">停止</button>
            <button class="btn btn-clear" onclick="clearChat()">清空</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Messages will be rendered here -->
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="输入消息..." rows="1" onkeydown="handleKeydown(event)"></textarea>
        </div>
        <button class="btn btn-send" id="btnSend" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // State
        let messages = [];
        let currentRequestId = null;
        let lastEventId = -1;
        let currentAssistantContent = '';
        let isStreaming = false;
        let isDisconnected = false;
        let abortController = null;
        let eventSource = null;

        // DOM elements
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnReconnect = document.getElementById('btnReconnect');
        const btnStop = document.getElementById('btnStop');
        const btnSend = document.getElementById('btnSend');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Auto-resize textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function setStatus(status, text) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = text;
        }

        function updateButtons() {
            btnDisconnect.disabled = !isStreaming || isDisconnected;
            btnReconnect.disabled = !isDisconnected || !currentRequestId;
            btnStop.disabled = !isStreaming && !isDisconnected;
            btnSend.disabled = isStreaming;
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function renderMarkdown(content) {
            try {
                return marked.parse(content);
            } catch (e) {
                return content.replace(/\n/g, '<br>');
            }
        }

        function addUserMessage(content) {
            messages.push({ role: 'user', content });
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<div class="message-bubble">${renderMarkdown(content)}</div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function createAssistantBubble() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `<div class="message-bubble cursor-blink" id="assistantBubble"></div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
            return document.getElementById('assistantBubble');
        }

        function updateAssistantBubble(content, done = false) {
            const bubble = document.getElementById('assistantBubble');
            if (!bubble) return;
            bubble.innerHTML = renderMarkdown(content);
            if (done) {
                bubble.classList.remove('cursor-blink');
            }
            scrollToBottom();
        }

        function finalizeAssistantMessage() {
            const bubble = document.getElementById('assistantBubble');
            if (bubble) {
                bubble.classList.remove('cursor-blink');
                bubble.removeAttribute('id');
            }
            if (currentAssistantContent) {
                messages.push({ role: 'assistant', content: currentAssistantContent });
            }
        }

        async function sendMessage() {
            const content = userInput.value.trim();
            if (!content || isStreaming) return;

            userInput.value = '';
            userInput.style.height = 'auto';

            addUserMessage(content);

            // Reset streaming state
            currentAssistantContent = '';
            lastEventId = -1;
            currentRequestId = null;
            isStreaming = true;
            isDisconnected = false;

            setStatus('streaming', '流式传输中...');
            updateButtons();

            createAssistantBubble();

            // Use fetch + ReadableStream for POST
            abortController = new AbortController();

            try {
                const response = await fetch(`${API_BASE}/v1/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: messages.slice(0, -0 || undefined), // send all messages except last assistant (which isn't added yet)
                        temperature: 0.7
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const events = parseSSEBuffer(buffer);
                    buffer = events.remaining;

                    for (const event of events.parsed) {
                        processEvent(event);
                    }
                }

                // Stream ended naturally
                if (isStreaming) {
                    streamComplete();
                }

            } catch (err) {
                if (err.name === 'AbortError') {
                    // Disconnect was called
                    console.log('Stream aborted by user (disconnect)');
                } else {
                    console.error('Stream error:', err);
                    setStatus('disconnected', '错误: ' + err.message);
                    isStreaming = false;
                    updateButtons();
                    finalizeAssistantMessage();
                }
            }
        }

        function parseSSEBuffer(buffer) {
            const parsed = [];
            const lines = buffer.split('\n');
            let currentEvent = {};
            let remaining = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // If this is the last line and doesn't end with \n, it's incomplete
                if (i === lines.length - 1 && !buffer.endsWith('\n')) {
                    remaining = line;
                    break;
                }

                if (line === '') {
                    // Empty line = end of event
                    if (currentEvent.data !== undefined) {
                        parsed.push({ ...currentEvent });
                    }
                    currentEvent = {};
                } else if (line.startsWith('id:')) {
                    currentEvent.id = line.slice(3).trim();
                } else if (line.startsWith('data:')) {
                    currentEvent.data = line.slice(5).trim();
                } else if (line.startsWith('event:')) {
                    currentEvent.event = line.slice(6).trim();
                }
            }

            return { parsed, remaining };
        }

        function processEvent(event) {
            if (event.id !== undefined) {
                lastEventId = parseInt(event.id, 10);
            }

            try {
                const data = JSON.parse(event.data);

                if (data.request_id) {
                    currentRequestId = data.request_id;
                }

                if (data.type === 'delta') {
                    currentAssistantContent += data.content;
                    updateAssistantBubble(currentAssistantContent);
                } else if (data.type === 'done') {
                    streamComplete();
                } else if (data.type === 'error') {
                    setStatus('disconnected', '服务器错误: ' + data.content);
                    isStreaming = false;
                    updateButtons();
                    finalizeAssistantMessage();
                }
            } catch (e) {
                console.warn('Failed to parse SSE data:', event.data, e);
            }
        }

        function streamComplete() {
            isStreaming = false;
            isDisconnected = false;
            setStatus('done', '完成');
            updateAssistantBubble(currentAssistantContent, true);
            finalizeAssistantMessage();
            currentRequestId = null;
            updateButtons();
        }

        function disconnect() {
            if (!isStreaming) return;

            // Abort the fetch but don't tell server to stop
            if (abortController) {
                abortController.abort();
                abortController = null;
            }

            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            isDisconnected = true;
            // isStreaming remains true conceptually (server still generating)
            setStatus('disconnected', '已断开 (服务端仍在生成)');
            updateButtons();
        }

        function reconnect() {
            if (!currentRequestId || !isDisconnected) return;

            setStatus('reconnecting', '重连中...');
            isDisconnected = false;
            updateButtons();

            // Use EventSource for GET /v1/chat/resume/<request_id>?last_event_id=<N>
            const url = `${API_BASE}/v1/chat/resume/${currentRequestId}?last_event_id=${lastEventId}`;

            eventSource = new EventSource(url);

            eventSource.onopen = () => {
                setStatus('streaming', '流式传输中 (已重连)');
                updateButtons();
            };

            eventSource.onmessage = (e) => {
                const event = {
                    id: e.lastEventId,
                    data: e.data
                };
                processEvent(event);
            };

            eventSource.onerror = (e) => {
                if (eventSource.readyState === EventSource.CLOSED) {
                    // Stream ended
                    eventSource.close();
                    eventSource = null;
                    if (isStreaming) {
                        streamComplete();
                    }
                } else {
                    // Connection error
                    console.error('EventSource error:', e);
                    eventSource.close();
                    eventSource = null;
                    isDisconnected = true;
                    setStatus('disconnected', '重连失败');
                    updateButtons();
                }
            };

            // Re-enable disconnect button
            btnDisconnect.disabled = false;
        }

        function stopGeneration() {
            // Client-side stop: abort connection and finalize
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            isStreaming = false;
            isDisconnected = false;
            setStatus('done', '已停止');
            updateAssistantBubble(currentAssistantContent, true);
            finalizeAssistantMessage();
            currentRequestId = null;
            updateButtons();
        }

        function clearChat() {
            // Stop any active stream first
            if (isStreaming || isDisconnected) {
                stopGeneration();
            }
            messages = [];
            chatContainer.innerHTML = '';
            currentAssistantContent = '';
            lastEventId = -1;
            currentRequestId = null;
            setStatus('', '就绪');
            updateButtons();
        }

        // Initialize
        updateButtons();
    </script>
</body>
</html>
