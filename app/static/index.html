<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface-hover: #1a2a4a;
            --border: #2a3a5a;
            --text: #e0e0e0;
            --text-muted: #8892a4;
            --accent: #4fc3f7;
            --accent-dim: #2a7a9f;
            --user-bg: #1b3a5c;
            --assistant-bg: #1e2a3a;
            --tool-bg: #2a2a1e;
            --success: #66bb6a;
            --error: #ef5350;
            --warning: #ffa726;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.disconnected { background: var(--error); }
        .status-dot.streaming { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header span {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .btn-new {
            padding: 4px 10px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-new:hover { opacity: 0.85; }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
        }

        .session-item:hover { background: var(--surface-hover); }
        .session-item.active { background: var(--accent-dim); }

        .session-item .title {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item .meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 16px;
            max-width: 80%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .bubble {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: var(--assistant-bg);
            border-bottom-left-radius: 4px;
        }

        .message.tool .bubble {
            background: var(--tool-bg);
            border-left: 3px solid var(--warning);
            font-size: 12px;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
        }

        .message .role {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .message.user .role { text-align: right; }

        /* Streaming indicator */
        .streaming-cursor::after {
            content: '▊';
            animation: blink 0.8s infinite;
            color: var(--accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-row textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 42px;
            max-height: 150px;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row textarea:focus {
            border-color: var(--accent);
        }

        .btn-send {
            padding: 10px 18px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-send:hover { opacity: 0.85; }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-cancel {
            padding: 10px 14px;
            background: var(--error);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-cancel:hover { opacity: 0.85; }

        /* Settings bar */
        .settings-bar {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .settings-bar label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .settings-bar input, .settings-bar select {
            padding: 4px 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 12px;
            outline: none;
        }

        .settings-bar input:focus, .settings-bar select:focus {
            border-color: var(--accent);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Empty state */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 14px;
            flex-direction: column;
            gap: 8px;
        }

        .empty-state .icon { font-size: 48px; opacity: 0.3; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Agent Console</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">就绪</span>
        </div>
    </div>

    <div class="main">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>会话列表</span>
                <button class="btn-new" onclick="newSession()">+ 新建</button>
            </div>
            <div class="session-list" id="sessionList"></div>
        </div>

        <!-- Chat -->
        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <div>点击「新建」开始对话</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-row">
                    <textarea id="userInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                              rows="1" onkeydown="handleKeydown(event)"></textarea>
                    <button class="btn-send" id="btnSend" onclick="sendMessage()">发送</button>
                    <button class="btn-cancel" id="btnCancel" onclick="cancelRun()" style="display:none">停止</button>
                </div>
                <div class="settings-bar">
                    <label>模型:</label>
                    <input id="modelInput" type="text" value="deepseek-v4-pro" style="width:140px">
                    <label>System:</label>
                    <input id="systemInput" type="text" value="你是一个有帮助的AI助手。" style="width:220px">
                    <label>Temperature:</label>
                    <input id="tempInput" type="number" value="0.7" min="0" max="2" step="0.1" style="width:60px">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // State
        // ============================================================
        const API_BASE = window.location.origin + '/v1';

        let currentRunId = null;
        let lastEventId = 0;
        let isStreaming = false;
        let abortController = null;
        let sessions = []; // [{run_id, title, created_at}]

        // ============================================================
        // Session Management
        // ============================================================
        function newSession() {
            currentRunId = null;
            lastEventId = 0;
            document.getElementById('messages').innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <div>输入消息开始新对话</div>
                </div>
            `;
            updateSessionList();
            document.getElementById('userInput').focus();
        }

        function updateSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = sessions.map(s => `
                <div class="session-item ${s.run_id === currentRunId ? 'active' : ''}"
                     onclick="loadSession('${s.run_id}')">
                    <div class="title">${escapeHtml(s.title)}</div>
                    <div class="meta">${new Date(s.created_at * 1000).toLocaleString('zh-CN')}</div>
                </div>
            `).join('');
        }

        async function loadSession(runId) {
            if (isStreaming) return;

            try {
                const resp = await fetch(`${API_BASE}/runs/${runId}/messages`);
                if (!resp.ok) return;
                const data = await resp.json();

                currentRunId = runId;
                const msgContainer = document.getElementById('messages');
                msgContainer.innerHTML = '';

                for (const msg of data.messages) {
                    if (msg.role === 'system') continue;
                    appendMessage(msg.role, msg.content || '(tool call)');
                }

                // 获取当前的 last_event_id
                const stateResp = await fetch(`${API_BASE}/runs/${runId}`);
                if (stateResp.ok) {
                    const state = await stateResp.json();
                    // 不精确，但继续对话时会从 POST 响应获取
                }

                updateSessionList();
            } catch (e) {
                console.error('Load session failed:', e);
            }
        }

        // ============================================================
        // Send Message
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || isStreaming) return;

            input.value = '';
            autoResize(input);

            // 如果是新会话，清空 empty state
            if (!currentRunId) {
                document.getElementById('messages').innerHTML = '';
            }

            // 显示用户消息
            appendMessage('user', text);

            // 构建请求
            const body = {
                messages: [{ role: 'user', content: text }],
                model: document.getElementById('modelInput').value,
                temperature: parseFloat(document.getElementById('tempInput').value),
            };

            if (currentRunId) {
                body.run_id = currentRunId;
            } else {
                body.system = document.getElementById('systemInput').value;
            }

            setStreaming(true);

            try {
                // 1. 创建 / 继续 Run
                const resp = await fetch(`${API_BASE}/runs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    appendMessage('assistant', `❌ 错误: ${err.detail || resp.statusText}`);
                    setStreaming(false);
                    return;
                }

                const data = await resp.json();
                currentRunId = data.run_id;
                lastEventId = data.last_event_id;

                // 添加到会话列表
                if (!sessions.find(s => s.run_id === currentRunId)) {
                    sessions.unshift({
                        run_id: currentRunId,
                        title: text.slice(0, 30),
                        created_at: Date.now() / 1000,
                    });
                }
                updateSessionList();

                // 2. 订阅 SSE
                await subscribeSSE(currentRunId, lastEventId);

            } catch (e) {
                appendMessage('assistant', `❌ 网络错误: ${e.message}`);
                setStreaming(false);
            }
        }

        // ============================================================
        // SSE Subscription
        // ============================================================
        async function subscribeSSE(runId, fromEventId) {
            abortController = new AbortController();
            let assistantBubble = null;
            let fullText = '';

            try {
                const resp = await fetch(
                    `${API_BASE}/runs/${runId}/stream?last_event_id=${fromEventId}`,
                    { signal: abortController.signal }
                );

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留不完整的最后一行

                    for (const line of lines) {
                        if (!line.startsWith('data:')) continue;

                        try {
                            const event = JSON.parse(line.slice(5).trim());
                            const eventType = event.event;

                            switch (eventType) {
                                case 'text.delta':
                                    if (!assistantBubble) {
                                        assistantBubble = appendMessage('assistant', '', true);
                                    }
                                    fullText += event.data.content;
                                    assistantBubble.querySelector('.bubble').textContent = fullText;
                                    scrollToBottom();
                                    break;

                                case 'text.done':
                                    if (assistantBubble) {
                                        assistantBubble.querySelector('.bubble').classList.remove('streaming-cursor');
                                    }
                                    assistantBubble = null;
                                    fullText = '';
                                    break;

                                case 'tool.calling':
                                    appendMessage('tool', `🔧 调用工具: ${event.data.name}(${JSON.stringify(event.data.arguments)})`);
                                    break;

                                case 'tool.result':
                                    appendMessage('tool', `📋 结果: ${event.data.result}`);
                                    break;

                                case 'run.completed':
                                    setStreaming(false);
                                    setStatus('completed', '完成');
                                    setTimeout(() => setStatus('ready', '就绪'), 2000);
                                    return;

                                case 'run.failed':
                                    if (assistantBubble) {
                                        assistantBubble.querySelector('.bubble').classList.remove('streaming-cursor');
                                    }
                                    appendMessage('assistant', `❌ 执行失败: ${event.data.error || '未知错误'}`);
                                    setStreaming(false);
                                    return;

                                case 'run.cancelled':
                                    if (assistantBubble) {
                                        assistantBubble.querySelector('.bubble').classList.remove('streaming-cursor');
                                    }
                                    setStreaming(false);
                                    setStatus('ready', '已取消');
                                    return;

                                case 'run.in_progress':
                                    setStatus('streaming', `执行中 (Turn ${event.data.turn})`);
                                    break;
                            }
                        } catch (e) {
                            // ignore parse errors
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    appendMessage('assistant', `❌ 连接断开: ${e.message}`);
                }
            } finally {
                setStreaming(false);
            }
        }

        // ============================================================
        // Cancel
        // ============================================================
        async function cancelRun() {
            if (!currentRunId) return;

            if (abortController) {
                abortController.abort();
            }

            try {
                await fetch(`${API_BASE}/runs/${currentRunId}/cancel`, { method: 'POST' });
            } catch (e) {
                // ignore
            }

            setStreaming(false);
        }

        // ============================================================
        // UI Helpers
        // ============================================================
        function appendMessage(role, content, streaming = false) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const roleLabel = { user: '你', assistant: 'AI', tool: '工具' }[role] || role;

            div.innerHTML = `
                <div class="role">${roleLabel}</div>
                <div class="bubble ${streaming ? 'streaming-cursor' : ''}">${escapeHtml(content)}</div>
            `;

            container.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function setStreaming(active) {
            isStreaming = active;
            document.getElementById('btnSend').style.display = active ? 'none' : 'block';
            document.getElementById('btnCancel').style.display = active ? 'block' : 'none';
            document.getElementById('userInput').disabled = active;

            if (active) {
                setStatus('streaming', '生成中...');
            } else {
                setStatus('ready', '就绪');
            }
        }

        function setStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusText');
            dot.className = 'status-dot';

            if (state === 'streaming') dot.classList.add('streaming');
            else if (state === 'error') dot.classList.add('disconnected');

            label.textContent = text;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Auto-resize textarea
        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', () => autoResize(textarea));

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        // ============================================================
        // Init: load existing sessions
        // ============================================================
        async function init() {
            try {
                const resp = await fetch(`${API_BASE}/runs?limit=20`);
                if (resp.ok) {
                    const runs = await resp.json();
                    sessions = runs.map(r => ({
                        run_id: r.run_id,
                        title: r.run_id.slice(0, 8) + '...',
                        created_at: r.created_at,
                    }));
                    updateSessionList();
                }
            } catch (e) {
                // server not running yet, that's fine
            }
        }

        init();
    </script>
</body>
</html>
